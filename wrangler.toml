# Cloudflare Workers configuration for the BentoPDF fork deployment.
#
# Static assets are served by Workers Static Assets; the Worker script only
# handles /libreoffice-wasm/* (the two >25 MiB LibreOffice blobs live in R2).
#
# Deploy via CI (.github/workflows/cloudflare-workers.yml), which prunes dist
# first. `public/.assetsignore` additionally excludes the R2-served LibreOffice
# files and build sidecars, so a local `wrangler deploy` works too.

name = "bentopdf"
main = "workers/index.js"
compatibility_date = "2026-09-18"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/libreoffice-wasm/*"]

[[r2_buckets]]
binding = "LIBREOFFICE_BUCKET"
bucket_name = "bentopdf-assets"
